name: weekly

# Runs when a gameweek has finished, not on a clock. Twice a day a small
# check (standard library only, no install) reads the fixture list. While a
# gameweek is still being played, or during an international break, it stops
# there. Once the last match of a gameweek is over and the official feed has
# closed it, the full run starts: tests, fetch three sources, check them,
# simulate 10,000 seasons, publish. A failed check stops the run, leaves the
# last good page up, and GitHub emails the repository owner.

on:
  schedule:
    - cron: "41 7,23 * * *"   # checks only, 07:41 and 23:41 UTC; the full run starts when a gameweek is over
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if no new result has arrived"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "site/index.html"
      - "requirements.txt"
      - ".github/workflows/weekly.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.trigger.outputs.due }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src
            data/current/fpl
            data/postponed.json
            outputs/run_meta.json
          sparse-checkout-cone-mode: false

      - name: Is a gameweek over?
        id: trigger
        env:
          PYTHONPATH: src
        run: python3 -m eplsim.trigger

  run:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest

      - name: Fetch, check, simulate
        id: week
        run: python -m eplsim.run_week ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}

      - name: Save the run
        if: steps.week.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current outputs site/feed.json site/history.json site/snapshots
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Matchweek ${{ steps.week.outputs.matchweek }}: ${{ steps.week.outputs.played }} results, 10,000 seasons"
            # a re-run starts from an old checkout; take any newer commits first so the push can land
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v6
        if: steps.week.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.week.outputs.changed == 'true'
        with:
          path: site

      - id: deploy
        if: steps.week.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
